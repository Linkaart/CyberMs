version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vulntrack
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vulntrack
      JWT_ACCESS_TOKEN_SECRET: YOUR_JWT_ACCESS_SECRET_HERE
      JWT_REFRESH_TOKEN_SECRET: YOUR_JWT_REFRESH_SECRET_HERE
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
    command: npm run dev

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      REACT_APP_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  db-data:
